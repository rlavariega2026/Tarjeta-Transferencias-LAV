<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none" />

  <!-- Background Glow Orb -->
  <circle cx="256" cy="220" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Modern Payment Card Geometric Shape -->
  <g transform="translate(96, 126)">
    <!-- Back card subtle tilt -->
    <rect x="24" y="0" width="272" height="170" rx="20" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2" transform="rotate(-6 160 85)" />
    
    <!-- Front card -->
    <rect x="0" y="24" width="320" height="200" rx="24" fill="#090d16" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Chip -->
    <rect x="36" y="60" width="46" height="36" rx="8" fill="url(#goldGrad)" />
    <path d="M36 78 H82 M59 60 V96 M48 60 C48 70 48 86 48 96 M70 60 C70 70 70 86 70 96" stroke="#92400e" stroke-width="1.5" />
    
    <!-- Contactless wave -->
    <path d="M102 66 C106 72 106 84 102 90 M110 61 C116 71 116 89 110 99 M118 56 C126 70 126 95 118 109" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Brand Name LAV -->
    <text x="284" y="76" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="end" letter-spacing="1.5">LAV</text>
    <text x="284" y="93" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="end" letter-spacing="2">PAGOS</text>

    <!-- Card Number Mock Bars -->
    <rect x="36" y="130" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.8" />
    <rect x="84" y="130" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.8" />
    <rect x="132" y="130" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.8" />
    <rect x="180" y="130" width="40" height="8" rx="4" fill="#10b981" />

    <!-- Cardholder & Hologram -->
    <rect x="36" y="166" width="90" height="6" rx="3" fill="#64748b" />
    <circle cx="270" cy="170" r="14" fill="#06b6d4" fill-opacity="0.7" />
    <circle cx="284" cy="170" r="14" fill="#10b981" fill-opacity="0.7" />
  </g>

  <!-- Bottom Fast Payment Badge -->
  <g transform="translate(146, 380)">
    <rect width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Checkmark icon -->
    <circle cx="26" cy="21" r="12" fill="#10b981" />
    <path d="M21 21 L24.5 24.5 L31 17.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.5">TRANSFERENCIA & PAYPAL</text>
  </g>
</svg>
