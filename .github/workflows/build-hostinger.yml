name: Build Hostinger package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Assemble shared-hosting package
        run: |
          mkdir -p deploy/api deploy/data deploy/uploads
          cp -a dist/. deploy/
          cp api/index.php deploy/api/index.php
          cp .htaccess deploy/.htaccess
          printf '[]\n' > deploy/data/cards.json
          cp data/.htaccess deploy/data/.htaccess
          cp uploads/.htaccess deploy/uploads/.htaccess
          test -f deploy/index.html
          test -f deploy/api/index.php
          test -f deploy/manifest.json
      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: Tarjetas-transferencias-Hostinger
          path: deploy/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
