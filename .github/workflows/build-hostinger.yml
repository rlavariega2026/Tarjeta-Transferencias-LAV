name: Build and deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Evitar despliegues FTP simultáneos que puedan sobrescribirse entre sí.
concurrency:
  group: hostinger-tarjetas-transferencias
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Assemble frontend package
        run: |
          mkdir -p deploy
          cp -a dist/. deploy/
          cp .htaccess deploy/.htaccess
          test -f deploy/index.html
          test -f deploy/.htaccess
          test -f deploy/manifest.json
          cd deploy
          zip -qr ../Tarjetas-transferencias-Hostinger.zip .
          cd ..
          test -s Tarjetas-transferencias-Hostinger.zip

      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: Tarjetas-transferencias-Hostinger
          path: |
            deploy/
            Tarjetas-transferencias-Hostinger.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Detect FTP root and destination
        id: ftp_path
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          host = os.environ['FTP_SERVER'].replace('ftp://','').replace('ftps://','').strip('/')
          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=25)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          start = ftp.pwd()
          entries = ftp.nlst()
          names = {x.rstrip('/').split('/')[-1] for x in entries}
          if 'public_html' in names:
              target = 'public_html/Tarjetas-transferencias/'
          elif 'Tarjetas-transferencias' in names or start.rstrip('/').endswith('/public_html'):
              target = 'Tarjetas-transferencias/'
          else:
              raise RuntimeError('Cannot identify FTP public_html directory safely; deployment stopped')
          ftp.cwd(target.rstrip('/'))
          print('FTP initial directory:', start)
          print('Verified destination:', ftp.pwd())
          ftp.quit()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('server_dir=' + target + '\\n')
          PY

      - name: Deploy frontend to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ steps.ftp_path.outputs.server_dir }}
          local-dir: ./deploy/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/**
            **/data/**
            **/uploads/**
