name: Build and deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Evitar despliegues FTP simultáneos que puedan sobrescribirse entre sí.
concurrency:
  group: hostinger-tarjetas-transferencias
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Assemble frontend package
        run: |
          mkdir -p deploy
          cp -a dist/. deploy/
          cp .htaccess deploy/.htaccess
          test -f deploy/index.html
          test -f deploy/.htaccess
          test -f deploy/manifest.json
          cd deploy
          zip -qr ../Tarjetas-transferencias-Hostinger.zip .
          cd ..
          test -s Tarjetas-transferencias-Hostinger.zip

      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: Tarjetas-transferencias-Hostinger
          path: |
            deploy/
            Tarjetas-transferencias-Hostinger.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Detect FTP root and destination
        id: ftp_path
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          host = os.environ['FTP_SERVER'].replace('ftp://','').replace('ftps://','').strip('/')
          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=25)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          start = ftp.pwd()
          # The domain has its own document root; /public_html is NOT the live domain.
          target = '/domains/lavdigitalagency.com/public_html/Tarjetas-transferencias/'
          ftp.cwd(target.rstrip('/'))
          print('FTP initial directory:', start)
          print('Verified destination:', ftp.pwd())
          ftp.quit()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('server_dir=' + target + chr(10))
          PY

      - name: Stamp release for verification
        run: |
          echo "${GITHUB_SHA}" > deploy/lav-release.txt

      - name: Deploy frontend to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ steps.ftp_path.outputs.server_dir }}
          state-name: .ftp-deploy-lav-transferencias-20261115.json
          local-dir: ./deploy/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/**
            **/data/**
            **/uploads/**

      - name: Deploy PHP API without touching stored cards or uploads
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET: ${{ steps.ftp_path.outputs.server_dir }}
        run: |
          python3 - <<'PY'
          import ftplib, os, io
          ftp=ftplib.FTP(os.environ['FTP_SERVER'].replace('ftp://','').replace('ftps://','').strip('/'),timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.cwd(os.environ['FTP_TARGET'])
          try:
              ftp.cwd('api')
          except ftplib.error_perm:
              ftp.mkd('api')
              ftp.cwd('api')
          with open('api/index.php','rb') as f:
              ftp.storbinary('STOR index.php',f)
          received=io.BytesIO()
          ftp.retrbinary('RETR index.php',received.write)
          with open('api/index.php','rb') as f:
              assert received.getvalue()==f.read(), 'PHP API upload verification failed'
          print('PHP API uploaded and verified; existing cards and uploads preserved')
          ftp.quit()
          PY

      - name: Verify uploaded release on FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET: ${{ steps.ftp_path.outputs.server_dir }}
        run: |
          python3 - <<'PY'
          import ftplib, os, io
          host=os.environ['FTP_SERVER'].replace('ftp://','').replace('ftps://','').strip('/')
          ftp=ftplib.FTP(host,timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.cwd(os.environ['FTP_TARGET'])
          data=io.BytesIO()
          ftp.retrbinary('RETR lav-release.txt',data.write)
          actual=data.getvalue().decode().strip()
          expected=os.environ['GITHUB_SHA']
          print('FTP deployed SHA:',actual)
          if actual!=expected: raise RuntimeError('FTP release mismatch')
          ftp.quit()
          PY

      - name: Diagnose FTP account document root and domain mismatch
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,os
          f=ftplib.FTP(os.environ['FTP_SERVER'].replace('ftp://','').strip('/'),timeout=30)
          f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          print('FTP login root:',f.pwd())
          for d in ('.','..','/','/public_html','/domains','/domains/lavdigitalagency.com/public_html','/public_html/Tarjetas-transferencias'):
              try:
                  f.cwd(d)
                  print('DIRECTORY',d,'resolved',f.pwd(),'entries',[x.split('/')[-1] for x in f.nlst()][:30])
              except Exception as e: print('DIRECTORY UNAVAILABLE',d,str(e))
          f.quit()
          PY

      - name: Diagnose live HTTPS and DNS from GitHub runner
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import socket,urllib.request,urllib.error
          host='lavdigitalagency.com'
          try:
              print('DNS:',socket.getaddrinfo(host,443,type=socket.SOCK_STREAM))
          except Exception as e:
              print('DNS FAILED:',repr(e))
          for suffix in ('Tarjetas-transferencias/lav-release.txt','Tarjetas-transferencias/','Tarjetas-transferencias/api/health'):
              url='https://'+host+'/'+suffix
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'LAV-deployment-verifier','Cache-Control':'no-cache'}),timeout=20) as response:
                      data=response.read(400)
                      print('LIVE',url,'status',response.status,'final',response.url,'body',repr(data))
              except Exception as e:
                  print('LIVE FAILED',url,repr(e))
          PY
